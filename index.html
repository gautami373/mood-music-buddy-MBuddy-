<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Music Generator</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Mood-Based Music Generator 🎵</h1>
    <p>Select your mood</p>

    <div class="buttons">
      <button onclick="showSongs('happy')">Happy 😊</button>
      <button onclick="showSongs('sad')">Sad 😔</button>
      <button onclick="showSongs('relaxed')">Relaxed 🌙</button>
      <button onclick="showSongs('energetic')">Energetic ⚡</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
